<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="edge" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#title)"/>

  <!-- 右侧装饰:图谱节点(呼应 Neo4j + GraphRAG) -->
  <g opacity="0.9">
    <line x1="1032" y1="86"  x2="1108" y2="128" stroke="#c7d2fe" stroke-width="2" marker-end="url(#edge)"/>
    <line x1="1108" y1="128" x2="1052" y2="196" stroke="#c7d2fe" stroke-width="2" marker-end="url(#edge)"/>
    <line x1="1052" y1="196" x2="972"  y2="150" stroke="#c7d2fe" stroke-width="2" marker-end="url(#edge)"/>
    <line x1="972"  y1="150" x2="1032" y2="86"  stroke="#c7d2fe" stroke-width="2" marker-end="url(#edge)"/>
    <line x1="972"  y1="150" x2="1108" y2="128" stroke="#c7d2fe" stroke-width="2" marker-end="url(#edge)"/>
    <circle cx="1032" cy="86"  r="16" fill="#4f46e5"/>
    <circle cx="1108" cy="128" r="13" fill="#0d9488"/>
    <circle cx="1052" cy="196" r="15" fill="#d97706"/>
    <circle cx="972"  cy="150" r="11" fill="#6366f1"/>
    <circle cx="1140" cy="62"  r="7"  fill="#a5b4fc"/>
    <circle cx="1156" cy="200" r="6"  fill="#5eead4"/>
    <circle cx="930"  cy="96"  r="6"  fill="#fcd34d"/>
  </g>

  <!-- 主标题 -->
  <text x="72" y="102" font-size="52" font-weight="700" fill="url(#title)">AssistGen</text>
  <text x="72" y="146" font-size="24" font-weight="600" fill="#1e293b">基于大语言模型构建的智能客服系统</text>
  <text x="72" y="180" font-size="15" fill="#475569">FastAPI + Vue 3 前后端分离 · LangGraph 多工具工作流 · Neo4j + GraphRAG 电商图谱问答</text>

  <!-- 技术栈徽标 -->
  <g font-size="13" font-weight="600">
    <rect x="72"  y="212" width="96"  height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="120" y="232" text-anchor="middle" fill="#4338ca">DeepSeek</text>
    <rect x="176" y="212" width="88"  height="32" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="220" y="232" text-anchor="middle" fill="#0f766e">Ollama</text>
    <rect x="272" y="212" width="104" height="32" rx="16" fill="#fefce8" stroke="#fde68a"/>
    <text x="324" y="232" text-anchor="middle" fill="#b45309">LangGraph</text>
    <rect x="384" y="212" width="84"  height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="426" y="232" text-anchor="middle" fill="#4338ca">Neo4j</text>
    <rect x="476" y="212" width="108" height="32" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="530" y="232" text-anchor="middle" fill="#0f766e">GraphRAG</text>
    <rect x="592" y="212" width="80"  height="32" rx="16" fill="#fefce8" stroke="#fde68a"/>
    <text x="632" y="232" text-anchor="middle" fill="#b45309">FAISS</text>
    <rect x="680" y="212" width="88"  height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="724" y="232" text-anchor="middle" fill="#4338ca">Vue 3</text>
  </g>
</svg>
